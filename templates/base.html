{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GoWalk{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <link rel="icon" href="{% static 'homepage/img/logo.svg' %}">
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container pb-4">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="gowalk-footer">
        <div class="container">
            © <span id="current-year"></span> GoWalk — пешеходные маршруты
            по городу
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
